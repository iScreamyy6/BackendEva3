{% extends "base.html" %}

{% block titulo %}{{ titulo|default:"Formulario Asignación de Meta" }} | SGR La Serena{% endblock %}

{% block contenido %}
<div class="titulo">
  <div>
    <p class="etiqueta">ENTIDAD #15 — ASIGNACIÓN DE METAS</p>
    <h1>{{ titulo|default:"Gestión de Asignación de Meta" }}</h1>
  </div>
  <a href="{% url 'asignaciones_metas_lista' %}" class="btn-secundario">← Volver al Listado</a>
</div>

<div class="form-card">
  <form method="post" action="">
    {% csrf_token %}
    <div class="formulario-grilla">
      <div class="formulario-grupo">
        <label for="codigo">Código Único <small style="color: var(--muted);">(Automático si se deja vacío)</small></label>
        <input type="text" id="codigo" name="codigo" value="{{ asignacion.codigo|default:valores.codigo|default:'' }}" placeholder="Ej: ASG-0001">
      </div>

      <div class="formulario-grupo">
        <label for="id_funcionario">Funcionario Asignado *</label>
        <select id="id_funcionario" name="id_funcionario" required>
          <option value="">Seleccione funcionario...</option>
          {% for f in funcionarios %}
          <option value="{{ f.pk }}" {% if asignacion.id_funcionario_id == f.pk or valores.id_funcionario == f.pk|stringformat:"s" %}selected{% endif %}>
            {{ f.nombre }} — {{ f.cargo }} ({{ f.id_delegacion.nombre }})
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="formulario-grupo">
        <label for="id_periodo">Trimestre / Período *</label>
        <select id="id_periodo" name="id_periodo" required>
          <option value="">Seleccione trimestre...</option>
          {% for p in periodos %}
          <option value="{{ p.pk }}" {% if asignacion.id_periodo_id == p.pk or valores.id_periodo == p.pk|stringformat:"s" %}selected{% endif %}>
            [{{ p.codigo }}] {{ p.nombre }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="formulario-grupo">
        <label for="id_item_meta">Meta del Catálogo Oficial</label>
        <select id="id_item_meta" name="id_item_meta" onchange="if(this.selectedIndex>0) document.getElementById('item').value=this.options[this.selectedIndex].dataset.nombre;">
          <option value="">-- Seleccione ítem del catálogo --</option>
          {% for it in items_meta %}
          <option value="{{ it.pk }}" data-nombre="{{ it.nombre }}" {% if asignacion.id_item_meta_id == it.pk or valores.id_item_meta == it.pk|stringformat:"s" %}selected{% endif %}>
            [{{ it.codigo }}] {{ it.nombre }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="formulario-grupo">
        <label for="item">Nombre de la Meta Asignada *</label>
        <input type="text" id="item" name="item" value="{{ asignacion.item|default:valores.item|default:'' }}" placeholder="Ej: ATENCION DE USUARIO TELEFONO Y PRESENCIAL" required>
      </div>

      <div class="formulario-grupo">
        <label for="meta_periodo">Cantidad Objetivo (&gt; 0) *</label>
        <input type="number" id="meta_periodo" name="meta_periodo" min="1" value="{{ asignacion.meta_periodo|default:valores.meta_periodo|default:'10' }}" required>
      </div>

      <div class="formulario-grupo">
        <label for="ponderador">Ponderación % (0 a 100) *</label>
        <input type="number" step="0.01" id="ponderador" name="ponderador" min="0" max="100" value="{{ asignacion.ponderador|default:valores.ponderador|default:'25' }}" required>
      </div>

      <div class="formulario-grupo">
        <label for="avance_actual">Avance Actual</label>
        <input type="number" id="avance_actual" name="avance_actual" min="0" value="{{ asignacion.avance_actual|default:valores.avance_actual|default:'0' }}">
      </div>

      <div class="formulario-grupo">
        <label for="fecha_asignacion">Fecha de Asignación</label>
        <input type="date" id="fecha_asignacion" name="fecha_asignacion" value="{{ asignacion.fecha_asignacion|date:'Y-m-d'|default:valores.fecha_asignacion|default:'' }}">
      </div>

      <div class="formulario-grupo">
        <label for="estado">Estado *</label>
        <select id="estado" name="estado" required>
          <option value="Activa" {% if asignacion.estado == 'Activa' or valores.estado == 'Activa' %}selected{% endif %}>Activa</option>
          <option value="Cumplida" {% if asignacion.estado == 'Cumplida' or valores.estado == 'Cumplida' %}selected{% endif %}>Cumplida</option>
          <option value="Inactiva" {% if asignacion.estado == 'Inactiva' or valores.estado == 'Inactiva' %}selected{% endif %}>Inactiva</option>
        </select>
      </div>

      <div class="formulario-grupo ancho-completo">
        <label for="observacion">Observación</label>
        <textarea id="observacion" name="observacion" rows="2" placeholder="Notas o criterios de evaluación de la asignación...">{{ asignacion.observacion|default:valores.observacion|default:'' }}</textarea>
      </div>
    </div>
    <div class="form-acciones">
      <a href="{% url 'asignaciones_metas_lista' %}" class="btn-secundario">Cancelar</a>
      <button type="submit" class="btn-primario-sgr">Guardar Asignación</button>
    </div>
  </form>
</div>
{% endblock %}
