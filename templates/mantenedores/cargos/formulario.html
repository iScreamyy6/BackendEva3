{% extends "base.html" %}

{% block titulo %}{{ titulo|default:"Formulario Cargo" }} | SGR La Serena{% endblock %}

{% block contenido %}
<div class="titulo">
  <div>
    <p class="etiqueta">ENTIDAD #4 — MANTENEDOR DE CARGOS</p>
    <h1>{{ titulo|default:"Gestión de Cargo" }}</h1>
  </div>
  <a href="{% url 'cargos_lista' %}" class="btn-secundario">← Volver al Listado</a>
</div>

<div class="form-card">
  <form method="post" action="">
    {% csrf_token %}
    <div class="formulario-grilla">
      <div class="formulario-grupo">
        <label for="codigo">Código Único <small style="color: var(--muted);">(Automático si se deja vacío)</small></label>
        <input type="text" id="codigo" name="codigo" value="{{ cargo.codigo|default:valores.codigo|default:'' }}" placeholder="Ej: CRG-01">
      </div>
      <div class="formulario-grupo">
        <label for="nombre">Nombre del Cargo *</label>
        <input type="text" id="nombre" name="nombre" value="{{ cargo.nombre|default:valores.nombre|default:'' }}" placeholder="Ej: Gestor Territorial" required>
      </div>
      <div class="formulario-grupo">
        <label for="estado">Estado *</label>
        <select id="estado" name="estado" required>
          <option value="Activo" {% if cargo.estado == 'Activo' or valores.estado == 'Activo' %}selected{% endif %}>Activo</option>
          <option value="Inactivo" {% if cargo.estado == 'Inactivo' or valores.estado == 'Inactivo' %}selected{% endif %}>Inactivo</option>
        </select>
      </div>
      <div class="formulario-grupo ancho-completo">
        <label for="descripcion">Descripción / Funciones del Cargo</label>
        <textarea id="descripcion" name="descripcion" rows="3" placeholder="Funciones y responsabilidades principales...">{{ cargo.descripcion|default:valores.descripcion|default:'' }}</textarea>
      </div>
    </div>
    <div class="form-acciones">
      <a href="{% url 'cargos_lista' %}" class="btn-secundario">Cancelar</a>
      <button type="submit" class="btn-primario-sgr">Guardar Cargo</button>
    </div>
  </form>
</div>
{% endblock %}
